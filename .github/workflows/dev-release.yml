name: Dev release

# Assembled from the ParkviewLab handbook's dev-release parts, one for each of
# this repository's publish targets that has a dev counterpart: the gate, then
# the dev job of each of those targets. The recipe is in the handbook's ci.md.
#
# A dev build is for local testing: a candidate CI builds before the release, not
# a version for others to use. Manually triggered on develop, by `git dev-release
# <patch|minor|major>`, which passes the kind as this workflow's `kind` input. It
# commits nothing: the gate computes the dev version from the newest release tag,
# the kind and the run, and each build job sets it in its own workspace. It
# creates NO `v*` tag, so the release gate is untouched, and runs no changelog
# job. See the handbook's releases.md ("What a release publishes", "Development
# versioning").

on:
  workflow_dispatch:
    inputs:
      kind:
        description: The release this build heads toward, counted from the newest release tag
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0        # the tags, to count the dev version from the newest release
      - name: Compute the dev version
        id: v
        env:
          KIND: ${{ inputs.kind }}
          RUN: ${{ github.run_number }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "dev-release runs from develop only (got $GITHUB_REF)"; exit 1
          fi
          # The repository's version file sets the dev marker's form.
          if [ -f pyproject.toml ]; then
            FILE=pyproject.toml; SEP=.dev
            CURRENT=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          elif [ -f package.json ]; then
            FILE=package.json; SEP=-dev
            CURRENT=$(jq -r .version package.json)
          elif [ -f VERSION.txt ]; then
            echo "::error::a repository whose version is in VERSION.txt has no dev build (handbook releases.md)"; exit 1
          else
            echo "no version file: expected pyproject.toml or package.json"; exit 1
          fi
          # The target: the newest vX.Y.Z tag, incremented by the kind as dev-tools'
          # _sot.sh sot_compute_next increments a plain version.
          TAG=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | awk 'NR==1' || true)
          if [ -n "$TAG" ]; then
            IFS=. read -r X Y Z <<< "${TAG#v}"
            case "$KIND" in
              patch) TARGET="$X.$Y.$((Z + 1))" ;;
              minor) TARGET="$X.$((Y + 1)).0" ;;
              major) TARGET="$((X + 1)).0.0" ;;
              *) echo "::error::kind '$KIND' is not patch, minor or major"; exit 1 ;;
            esac
          else
            # Before the first release there is nothing to count from: the target
            # is the version file's version, without its dev marker.
            TARGET=$(printf '%s\n' "$CURRENT" | sed -E 's/[.-]dev[0-9]*$//')
            echo "no release tag yet: the target is $FILE's $TARGET, and the kind is not used"
          fi
          # N from the run, so that each build, re-runs included, has its own
          # version: TestPyPI never accepts a file name twice.
          VERSION="$TARGET$SEP$((RUN * 100 + ATTEMPT))"
          echo "dev version: $VERSION (newest release: ${TAG:-none}; kind: $KIND)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # Unsigned installers for macOS, Windows and Linux, uploaded as workflow
  # artifacts and kept seven days. There is no `v*` tag and no GitHub Release, so
  # the release gate is untouched; the build is for local testing.
  installers:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - name: Set the dev version in the workspace (nothing is committed)
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
      - run: npm ci
      # electron 43 ships no install script, so `npm ci` does not extract its prebuilt.
      # dist/ is otherwise filled lazily on first require, which `npm run legal` never
      # triggers (it reads dist/ from disk). Extract it now so dist/ and its Chromium
      # notices exist before `npm run legal`.
      - run: node node_modules/electron/install.js
      - run: npm run legal      # generate legal/ before electron-builder copies extraResources
      - run: npm run build
      - name: Package installers (unsigned)
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v6
        with:
          name: dev-installers-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
