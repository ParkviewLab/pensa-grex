name: Deploy the site

# Publishes https://parkviewlab.github.io/pensa-grex/ from main — released content
# only, so what the site says is what the newest release ships. scripts/
# build_pages_site.py assembles the whole site into a directory and this workflow
# uploads that directory: the generated index (the introduction, the Downloads link
# and the list of documents), the download page under /downloads/, and docs/
# byte-identical to the repository under /docs/. Nothing generated is committed, and
# there is no Jekyll or other build system in the path.
#
# main advances only at a release, so a release is what redeploys the site, and the
# script pins every GitHub link to the newest v* tag reachable from HEAD. git
# push --follow-tags sends the branch and its tag together, so the new tag is on the
# runner by the time the build reads it. Note what the build does NOT do: it takes
# whatever v* tag is reachable, so a run that somehow started before the tag landed
# would stamp the PREVIOUS release and publish successfully; it fails only when no
# v* tag exists at all. That leniency is deliberate, since a later manual run sits on
# the changelog commit rather than on the tagged one; if a deployment ever does stamp
# a stale version, re-run this workflow by hand once the tag is in place.
#
# The Pages source is GitHub Actions (gh api -X PUT repos/ParkviewLab/pensa-grex/
# pages -f build_type=workflow), and the github-pages environment's branch policy
# must allow main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main             # always publish the released state, never develop
          fetch-depth: 0        # tags — the build reads the newest release from them

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build the site
        run: python3 scripts/build_pages_site.py --out "${{ runner.temp }}/site"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@v5
